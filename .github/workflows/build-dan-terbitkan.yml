# Mancing Mania: rakit APK lalu terbitkan situs (web app + tombol unduh APK) ke GitHub Pages
name: Build APK & Website

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Bongkar proyek dari zip
        run: |
          unzip -q -o mancing-mania-apk.zip -d _src
          cp -a _src/mancing-mania-apk/. .
          rm -rf _src

      - name: Pasang Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Pasang Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Isi kunci Supabase dari Secrets (bila ada)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            node -e "
              const fs=require('fs');let s=fs.readFileSync('www/config.js','utf8');
              s=s.replace(/SUPABASE_URL:\s*\"[^\"]*\"/,'SUPABASE_URL: '+JSON.stringify(process.env.SUPABASE_URL));
              s=s.replace(/SUPABASE_ANON_KEY:\s*\"[^\"]*\"/,'SUPABASE_ANON_KEY: '+JSON.stringify(process.env.SUPABASE_ANON_KEY));
              fs.writeFileSync('www/config.js',s);"
          fi

      - name: Salin aplikasi ke Android
        run: |
          npm ci
          npx cap sync android

      - name: Rakit APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Susun situs (web app + APK)
        run: |
          mkdir -p site
          cp -a www/. site/
          cp android/app/build/outputs/apk/debug/app-debug.apk site/mancing-mania.apk
          cp www/sw.js site/sw.js 2>/dev/null || true
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
